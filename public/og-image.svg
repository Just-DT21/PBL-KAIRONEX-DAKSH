<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050507"/>
      <stop offset="1" stop-color="#0c0c16"/>
    </linearGradient>
    <linearGradient id="g" x1="540" y1="225" x2="660" y2="405" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5b8cff"/>
      <stop offset="0.55" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#3ee6d8"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.28" cy="0.3" r="0.5">
      <stop offset="0" stop-color="#5b8cff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#5b8cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.75" cy="0.7" r="0.55">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- ambient network dust -->
  <g fill="#5b8cff" opacity="0.35">
    <circle cx="140" cy="480" r="3"/>
    <circle cx="230" cy="380" r="2.2"/>
    <circle cx="330" cy="520" r="2.6"/>
    <circle cx="1040" cy="150" r="3"/>
    <circle cx="960" cy="250" r="2.2"/>
    <circle cx="1100" cy="330" r="2.4"/>
  </g>
  <g stroke="#5b8cff" stroke-opacity="0.16" stroke-width="1.4">
    <path d="M140 480 L230 380 L330 520"/>
    <path d="M1040 150 L960 250 L1100 330"/>
  </g>

  <!-- nexus mark -->
  <g transform="translate(548 218)">
    <rect x="1.5" y="1.5" width="101" height="101" rx="28" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
    <path d="M30 27 L74 79" stroke="url(#g)" stroke-width="8.4" stroke-linecap="round"/>
    <path d="M74 27 L30 79" stroke="url(#g)" stroke-width="8.4" stroke-linecap="round" opacity="0.55"/>
    <path d="M52 38.5 L68.5 53 L52 67.5 L35.5 53 Z" fill="url(#g)"/>
  </g>

  <!-- wordmark -->
  <text x="600" y="398" text-anchor="middle" font-family="Space Grotesk, Arial, sans-serif" font-size="64" font-weight="700" letter-spacing="18" fill="#f4f6fb">KAIRONEXA</text>
  <text x="600" y="446" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="600" letter-spacing="9.5" fill="#878c9f">WHERE IDEAS MEET CAPITAL</text>

  <!-- venture identity -->
  <text x="600" y="560" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" letter-spacing="4.5" fill="#5b6070">A DT21 VENTURE</text>
</svg>
